name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release blocked: tag commit is not in origin/main history."
            exit 1
          fi
          echo "Release gate passed: tag commit is in origin/main history."

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Check formatting
        run: make fmt-check

      - name: Static analysis
        run: make vet

      - name: Run tests
        run: make test

      - name: Package release
        env:
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make package \
            VERSION="$VERSION" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$GITHUB_SHA"
          sha256sum "dist/enroll-conflict_${VERSION}_linux_amd64/enroll-conflict"
          sha256sum dist/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/enroll-conflict_${VERSION}_linux_amd64.tar.gz" \
            "dist/enroll-conflict_${VERSION}_linux_amd64.tar.gz.sha256" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
