name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Print build context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'github.event_name=%s\n' "$EVENT_NAME"
          printf 'github.ref=%s\n' "$EVENT_REF"
          printf 'github.sha=%s\n' "$EVENT_SHA"
          printf 'pull_request.head.sha=%s\n' "$PR_HEAD_SHA"

      - name: Check formatting
        run: make fmt-check

      - name: Static analysis
        run: make vet

      - name: Run tests
        run: make test

      - name: Package main artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package VERSION=0.0.0-main BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"
          sha256sum dist/enroll-conflict_0.0.0-main_linux_amd64/enroll-conflict
          sha256sum dist/*.tar.gz

      - name: Upload main artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: main-${{ github.sha }}-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
